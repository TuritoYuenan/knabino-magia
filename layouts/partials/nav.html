{{ $wordmark := resources.Get "wordmark.svg" | minify }}

<nav>
	<a href="{{ site.BaseURL }}" id="wordmark">
		<img src="{{ $wordmark.RelPermalink }}" alt="{{ site.Title }}" width="100" height="36">
	</a>

	<div class="menu">
		{{ range site.Menus.main }}
		<a href="{{ .URL }}">{{ .Name }}</a>
		{{ end }}
	</div>
</nav>
